[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-modal"
version = "0.1.0"
description = "Your private, serverless OpenAI-compatible API on Modal."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OpenModal Contributors"}
]
dependencies = [
    "modal",
    "rich",
    "openai",
    "questionary",
    "python-dotenv",
    "fastapi",
    "pydantic"
]

[project.scripts]
openmodal = "openmodal.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["openmodal"]
